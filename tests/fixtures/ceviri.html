<!doctype html>
<!-- Chrome sayfa çevirisinin DOM'a yaptığı değişikliği taklit eden yapay sayfa (gerçek içerik yok).
     Çeviri, <html> öğesine "translated-ltr" sınıfı ekler ve metin düğümlerini
     <font style="vertical-align: inherit;"> sarmalayıcılarıyla değiştirir. -->
<html lang="en" class="translated-ltr">
  <head>
    <meta charset="utf-8" />
    <title>Çeviri fixture</title>
    <style>
      .soluk { color: #b0b0b0; background: #ffffff; }
    </style>
  </head>
  <body>
    <main>
      <section class="duyurular">
        <p class="soluk" id="hedef-paragraf"><font style="vertical-align: inherit;"><font style="vertical-align: inherit;">Lorem ipsum announcement text</font></font></p>
        <p class="soluk"><font style="vertical-align: inherit;"><font style="vertical-align: inherit;">Dolor sit amet second text</font></font></p>
      </section>
      <ul>
        <li><a href="#a"><font style="vertical-align: inherit;"><font style="vertical-align: inherit;">First link</font></font></a></li>
        <li><a href="#b"><font style="vertical-align: inherit;"><font style="vertical-align: inherit;">Second link</font></font></a></li>
      </ul>
    </main>
  </body>
</html>
